    <style>
        /* ─── Contact-specific overrides ─── */
        body {
            background: linear-gradient(160deg, #f0f4ff 0%, #e8edf5 40%, #fafbfc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .contact-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 24px 60px;
        }

        .contact-card {
            max-width: 680px;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: var(--radius-lg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 48px 40px;
            text-align: center;
            animation: fadeInUp 0.7s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .contact-icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 8px 24px rgba(30, 58, 95, 0.25);
        }

        .contact-card h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 8px;
        }

        .contact-card .subtitle {
            color: var(--gray-400);
            font-size: 1rem;
            margin-bottom: 36px;
        }

        .contact-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            border-radius: 3px;
            margin: 0 auto 32px;
        }

        .contact-card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 24px;
        }

        .email-options {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 28px;
        }

        .email-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 28px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(30, 58, 95, 0.25);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .email-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(30, 58, 95, 0.35);
        }

        .email-link:active {
            transform: translateY(0);
        }

        .email-link i {
            font-size: 1.1rem;
        }

        .email-display {
            margin-top: 8px;
            padding: 16px 20px;
            background: rgba(255,255,255,0.6);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            border: 1px solid var(--gray-100);
        }

        .email-address {
            font-family: 'JetBrains Mono', 'Cascadia Code', monospace;
            color: var(--gray-700);
            font-size: 0.95rem;
            word-break: break-all;
        }

        .copy-btn {
            padding: 8px 18px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-1px);
        }

        .copy-btn.copied {
            background: var(--success);
        }

        .platform-hint {
            font-size: 0.82rem;
            color: var(--gray-400);
            margin-top: 4px;
            width: 100%;
        }

        .back-home-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 32px;
            color: var(--gray-400);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease, gap 0.2s ease;
        }

        .back-home-link:hover {
            color: var(--accent);
            gap: 12px;
        }

        @media (max-width: 600px) {
            .contact-card {
                padding: 32px 20px;
            }
            .contact-card h1 {
                font-size: 1.5rem;
            }
            .email-link {
                padding: 14px 20px;
                font-size: 0.9rem;
            }
            .email-display {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .copy-btn {
                width: 100%;
            }
        }
    </style>

<div class="contact-page">
    <div class="contact-card">
        <div class="contact-icon-wrap">
            <i class="fas fa-envelope"></i>
        </div>

        <h1>Get In Touch</h1>
        <p class="subtitle">We'd love to hear from you</p>
        <div class="contact-divider"></div>

        <h2><i class="fas fa-paper-plane" style="color:var(--accent);margin-right:8px"></i>Send us a message</h2>

        <div class="email-options">
            <a href="mailto:librarykvas2&#64;gmail&#46;com?subject=[Title of your Topic]&body=Type your Message Over Here" class="email-link" id="desktopEmailLink">
                <i class="fas fa-envelope-open-text"></i>
                Open Email App For Phone System
            </a>

            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=librarykvas2&#64;gmail&#46;com&su=[Title of your Topic]&body=Type your Message Over Here" target="_blank" rel="noopener noreferrer" class="email-link" id="gmailLink">
                <i class="fab fa-google"></i>
                Open in Gmail For PC System
            </a>
        </div>

        <div class="email-display">
            <div style="flex:1">
                <div class="email-address">librarykvas2&#64;gmail&#46;com</div>
                <div class="platform-hint" id="platformHint">Click a button above or copy this email address</div>
            </div>
            <button class="copy-btn" id="copyBtn">Copy</button>
        </div>

        <a href="../index.html" class="back-home-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
</div>

<script src="../assets/js/bundle.min.js" defer></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const desktopEmailLink = document.getElementById('desktopEmailLink');
        const gmailLink = document.getElementById('gmailLink');
        const copyBtn = document.getElementById('copyBtn');
        const platformHint = document.getElementById('platformHint');
        let notificationTimeout;

        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const isWindows = navigator.platform.indexOf('Win') > -1;

        if (isWindows) {
            platformHint.textContent = "Recommended for mobile devices";
            desktopEmailLink.innerHTML = '<i class="fas fa-envelope-open-text"></i> Open in Email App';
        } else if (isMobile) {
            platformHint.textContent = "If first button doesn't work, try Gmail or copy the address";
            desktopEmailLink.innerHTML = '<i class="fas fa-envelope-open-text"></i> Open Email';
        } else {
            platformHint.textContent = "Choose your preferred option";
        }

        function showNotification(message) {
            if (notificationTimeout) clearTimeout(notificationTimeout);
            const existing = document.querySelector('.email-notification');
            if (existing) existing.remove();

            const notification = document.createElement('div');
            notification.className = 'email-notification';
            notification.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--gray-800);color:white;padding:14px 20px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.15);z-index:10000;font-size:0.9rem;animation:notifIn 0.35s ease-out;';
            notification.textContent = message;

            if (!document.getElementById('notif-styles')) {
                const s = document.createElement('style');
                s.id = 'notif-styles';
                s.textContent = '@keyframes notifIn{from{transform:translateX(100%);opacity:0}}@keyframes notifOut{from{transform:translateX(0);opacity:1}to{transform:translateX(100%);opacity:0}}';
                document.head.appendChild(s);
            }

            document.body.appendChild(notification);
            notificationTimeout = setTimeout(() => {
                notification.style.animation = 'notifOut 0.3s ease-out';
                setTimeout(() => { if (notification.parentNode) notification.remove(); }, 300);
            }, 3000);
        }

        desktopEmailLink.addEventListener('click', function(e) {
            if (isMobile) showNotification('Opening your email app...');
            else if (isWindows) {
                showNotification('Attempting to open your default email client...');
                setTimeout(() => { if (!document.hidden) showNotification('If nothing happened, try the Gmail option below'); }, 1500);
            } else showNotification('Opening your default email client...');
        });

        gmailLink.addEventListener('click', function() {
            showNotification('Opening Gmail in your browser...');
        });

        copyBtn.addEventListener('click', function() {
            const email = 'librarykvas2' + String.fromCharCode(64) + 'gmail' + String.fromCharCode(46) + 'com';
            navigator.clipboard.writeText(email).then(function() {
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                showNotification('Email address copied to clipboard!');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy';
                    copyBtn.classList.remove('copied');
                }, 2000);
            }).catch(function() {
                const textArea = document.createElement('textarea');
                textArea.value = email;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                showNotification('Email address copied to clipboard!');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy';
                    copyBtn.classList.remove('copied');
                }, 2000);
            });
        });
    });
</script>
